[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minirag"
version = "0.1.0"
description = "面向学习的 MiniRAG Agent"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "langchain-core>=1.6.12,<2",
    "langchain-openai>=1.6.2,<2",
    "langchain-text-splitters>=1.1.2,<2",
    "langgraph>=1.2.11,<2",
    "langgraph-checkpoint>=4.2.0,<5",
    "numpy>=2.2.6,<3",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.16.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: 需要真实模型、Embedding 或重排服务",
    "integration: 需要本地 PostgreSQL 或 Redis",
]
addopts = "-m 'not live and not integration'"

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.10"
